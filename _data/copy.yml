global:
  about: "Welcome friends and neighbors - we're a new community organization dedicated to housing justice and keeping people in their homes in Kitsap! We're currently focused on canvassing at mobile home parks around
  Kitsap, educating the tenants about HB 1217, new law that prohibits mobile home park owners from raising the rent by more than 5% a year. Many of our local mobile home parks are owned by corporate landlords
  who have bought up to 80+ mobile parks across WA, ID, MT, SD and are now jacking up rents and throwing seniors out of their homes. As individuals we are weak, but organized together we are strong - get involved to put 
  our community over multi-millionaire landlords and outside investors!
  ¡Bienvenidos, amigos y vecinos! Somos una nueva organización comunitaria dedicada a la justicia en materia de vivienda y a que las personas en Kitsap conserven sus hogares. Actualmente, estamos realizando visitas a los 
parqueaderos de casas móviles de Kitsap para informar a los inquilinos sobre la HB 1217, una nueva ley que prohíbe a los propietarios de parques de casas móviles aumentar el alquiler más de un 5% anual. Muchos de nuestros 
parques locales son propiedad de grandes empresas inmobiliarias que han adquirido más de 80 parques en Washington, Idaho, Montana y Dakota del Sur, y ahora están subiendo los alquileres y desalojando a personas mayores de 
sus hogares. Individualmente somos débiles, pero unidos somos fuertes. ¡Participen para defender nuestra comunidad frente a los propietarios multimillonarios e inversores externos!"
  welcome: "Welcome to Kitsap Housing For All!"
  welcome-image: "assets/images/housing-human-right.jpg"

